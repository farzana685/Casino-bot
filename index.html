<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Funky Time Pro Live</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        :root { --bg: #060913; --card: #0f1626; --primary: #ff0055; --secondary: #00f0ff; --green: #39ff14; --gold: #ffbd00; }
        body { margin: 0; font-family: sans-serif; background-color: var(--bg); color: #fff; padding: 10px; display: flex; justify-content: center; }
        .wrapper { width: 100%; max-width: 500px; display: flex; flex-direction: column; gap: 15px; }
        .panel { background: var(--card); border-radius: 16px; padding: 15px; border: 1px solid rgba(255,255,255,0.05); }
        .header { font-size: 18px; font-weight: 800; text-align: center; color: var(--secondary); margin-bottom: 10px; text-transform: uppercase; }
        .tabs { display: flex; background: #000; padding: 4px; border-radius: 25px; margin-bottom: 15px; }
        .tab-btn { flex: 1; background: transparent; border: none; color: #8f9fb6; padding: 10px; border-radius: 20px; font-weight: bold; cursor: pointer; }
        .tab-btn.active { background: #1a243d; color: var(--secondary); }
        .metrics { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 15px; }
        .metric-box { background: #070b14; padding: 10px 5px; border-radius: 8px; text-align: center; border-left: 2px solid var(--secondary); }
        .lbl { font-size: 10px; color: #8fa0b7; text-transform: uppercase; }
        .val { font-size: 14px; font-weight: bold; margin-top: 3px; }
        .wheel-box { display: flex; flex-direction: column; align-items: center; margin: 15px 0; }
        .outer-ring { position: relative; width: 280px; height: 280px; background: #070b14; border-radius: 50%; padding: 6px; box-shadow: 0 0 30px rgba(0,240,255,0.3); border: 4px solid #1f2d4d; }
        .w-canvas { width: 100%; height: 100%; border-radius: 50%; transition: transform 6s cubic-bezier(0.1, 0.8, 0.1, 1); }
        .pointer { position: absolute; top: -10px; left: 50%; transform: translateX(-50%); width: 0; height: 0; border-left: 12px solid transparent; border-right: 12px solid transparent; border-top: 22px solid #fff; z-index: 10; }
        .bet-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 15px; }
        .b-node { background: #141c2f; border: 1px solid rgba(255,255,255,0.05); border-radius: 8px; padding: 12px 2px; text-align: center; cursor: pointer; font-size: 11px; }
        .b-node.selected { background: rgba(255, 0, 85, 0.2); border-color: var(--primary); box-shadow: 0 0 10px var(--primary); }
        .mul { font-size: 10px; color: var(--gold); font-weight: bold; }
        input, select, button { width: 100%; box-sizing: border-box; background: #070b14; border: 1px solid #1f2d4d; border-radius: 8px; padding: 12px; color: #fff; font-size: 14px; outline: none; }
        .btn-main { background: linear-gradient(90deg, var(--primary), #d00045); border: none; font-weight: bold; cursor: pointer; }
        .req-row { background: #070b14; padding: 12px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; font-size: 13px; }
        .btn-action { padding: 4px 10px; border-radius: 4px; border: none; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>
<div class="wrapper">
    <div class="panel">
        <div class="header">🎰 Funky Live Engine</div>
        <div class="tabs">
            <button class="tab-btn active" id="tPlr" onclick="toggleTab('player')">Player Lobby</button>
            <button class="tab-btn" id="tAdm" onclick="toggleTab('admin')">Admin Panel</button>
        </div>

        <div id="pSec">
            <div id="gAuth" class="bet-grid" style="grid-template-columns: 1fr;">
                <select id="pPhone">
                    <option value="5550191">Player Line: 5550191</option>
                    <option value="5550192">Player Line: 5550192</option>
                    <option value="5550193">Player Line: 5550193</option>
                    <option value="5550194">Player Line: 5550194</option>
                    <option value="5550195">Player Line: 5550195</option>
                </select>
                <button class="btn-main" onclick="initPlayer()">Enter Room</button>
            </div>

            <div id="pEngine" style="display:none;">
                <div class="metrics">
                    <div class="metric-box"><div class="lbl">Line</div><div class="val" id="myL" style="color:var(--secondary);"></div></div>
                    <div class="metric-box"><div class="lbl">Tokens</div><div class="val" id="myB" style="color:var(--green);">৳0</div></div>
                    <div class="metric-box"><div class="lbl">Bet</div><div class="val" id="myBt" style="color:var(--gold);">৳0</div></div>
                </div>

                <div class="wheel-box">
                    <div class="outer-ring">
                        <div class="pointer"></div>
                        <canvas id="liveWheel" class="w-canvas" width="300" height="300"></canvas>
                    </div>
                    <div id="spinStatus" style="font-weight: bold; margin-top: 12px; color: var(--secondary); text-align:center;">Waiting for Bets...</div>
                </div>

                <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px; margin-bottom:15px; background:#070b14; padding:10px; border-radius:8px;">
                    <div><input type="number" id="dAmt" placeholder="Deposit ৳"><button class="btn-main" style="background:var(--green); color:#000; margin-top:5px; padding:8px;" onclick="reqTx('deposit')">Deposit</button></div>
                    <div><input type="number" id="wAmt" placeholder="Withdraw ৳"><button class="btn-main" style="margin-top:5px; padding:8px;" onclick="reqTx('withdraw')">Withdraw</button></div>
                </div>

                <div class="bet-grid">
                    <div class="b-node" onclick="clickChannel('1')">Number 1<div class="mul">1x</div></div>
                    <div class="b-node" onclick="clickChannel('Letter')">Letters<div class="mul">25x</div></div>
                    <div class="b-node" onclick="clickChannel('BAR')">Bar Slots<div class="mul">5x</div></div>
                    <div class="b-node" onclick="clickChannel('VIP1')">VIP 1<div class="mul">15x</div></div>
                    <div class="b-node" onclick="clickChannel('VIP2')">VIP 2<div class="mul">50x</div></div>
                    <input type="number" id="betAmt" value="50" style="grid-column: span 3;">
                    <button class="btn-main" style="grid-column: span 4; background: linear-gradient(90deg, #00c6ff, #0072ff);" onclick="betAll()">Bet on All Channels</button>
                </div>
            </div>
        </div>

        <div id="aSec" style="display:none;">
            <div class="metrics">
                <div class="metric-box"><div class="lbl">Online</div><div class="val" id="admOn">0</div></div>
                <div class="metric-box" style="grid-column: span 2; border-left-color: var(--primary);"><div class="lbl">House Vault (4% Hidden Cut)</div><div class="val" id="admV" style="color:var(--primary);">৳0.00</div></div>
            </div>
            <h4 style="margin: 10px 0; color: #8fa0b7;">Authorization Gateway</h4>
            <div id="reqBox"><p style="color:#8fa0b7; font-size:12px;">No active requests.</p></div>
        </div>
    </div>
</div>

<script>
    const socket = io();
    let currentPhone = null, selected = new Set(), engineRunning = false;
    const matrix = [{name:'1', color:'#1e293b'}, {name:'Letter', color:'#ff0055'}, {name:'BAR', color:'#00f0ff'}, {name:'VIP1', color:'#ffbd00'}, {name:'VIP2', color:'#a855f7'}];
    const canvas = document.getElementById('liveWheel'), ctx = canvas.getContext('2d');

    function draw() {
        const segs = 16, arc = Math.PI * 2 / segs;
        for (let i = 0; i < segs; i++) {
            ctx.fillStyle = matrix[i % matrix.length].color;
            ctx.beginPath(); ctx.arc(150, 150, 150, i*arc, (i+1)*arc); ctx.lineTo(150,150); ctx.fill();
            ctx.save(); ctx.fillStyle = '#fff'; ctx.font = 'bold 11px sans-serif'; ctx.translate(150, 150); ctx.rotate(i*arc + arc/2); ctx.textAlign = "right"; ctx.fillText(matrix[i%matrix.length].name, 135, 4); ctx.restore();
        }
    }
    draw();

    function triggerAudioTick() {
        const audio = new (window.AudioContext || window.webkitAudioContext)();
        const osc = audio.createOscillator(), gain = audio.createGain();
        osc.type = 'triangle'; osc.frequency.setValueAtTime(800, audio.currentTime); gain.gain.setValueAtTime(0.04, audio.currentTime);
        osc.connect(gain); gain.connect(audio.destination); osc.start(); osc.stop(audio.currentTime + 0.02);
    }

    socket.on('syncData', ({ database, houseVault }) => {
        document.getElementById('admOn').innerText = `${Object.keys(database).length} / 10`;
        document.getElementById('admV').innerText = `৳${houseVault.toFixed(2)}`;
        if (currentPhone && database[currentPhone]) {
            let d = database[currentPhone];
            document.getElementById('myB').innerText = `৳${d.balance.toFixed(2)}`;
            document.getElementById('myBt').innerText = d.activeBet > 0 ? `৳${d.activeBet}` : "৳0";
            
            let bAmt = parseFloat(document.getElementById('betAmt').value) || 0;
            if(selected.size > 0 && bAmt > 0 && !engineRunning && d.activeBet === 0 && d.balance >= bAmt) {
                socket.emit('submitBet', { phone: currentPhone, betAmount: bAmt, channels: Array.from(selected) });
                selected.clear(); document.querySelectorAll('.b-node').forEach(el => el.classList.remove('selected'));
            }
        }
        renderRequests(database);
    });

    socket.on('timerUpdate', (c) => { if(!engineRunning) document.getElementById('spinStatus').innerText = `Place Bets! Auto spinning in ${c}s`; });

    socket.on('triggerSpin', ({ targetDegrees, rolled }) => {
        engineRunning = true;
        document.getElementById('spinStatus').innerText = "⚡ ENGINE LIVE SPINNING ⚡";
        canvas.style.transform = `rotate(${targetDegrees}deg)`;
        let ticks = setInterval(() => triggerAudioTick(), 130);
        setTimeout(() => { clearInterval(ticks); document.getElementById('spinStatus').innerText = `Result: [ ${rolled} ]`; engineRunning = false; }, 6000);
    });

    function initPlayer() {
        currentPhone = document.getElementById('pPhone').value;
        document.getElementById('myL').innerText = currentPhone;
        document.getElementById('gAuth').style.display = 'none';
        document.getElementById('pEngine').style.display = 'block';
        socket.emit('playerLogin', currentPhone);
    }

    function clickChannel(t) { selected.has(t) ? selected.delete(t) : selected.add(t); document.querySelectorAll('.b-node').forEach(el => { if(el.getAttribute('onclick').includes(t)) el.classList.toggle('selected'); }); }
    function betAll() { matrix.forEach(m => selected.add(m.name)); document.querySelectorAll('.b-node').forEach(el => el.classList.add('selected')); }
    function reqTx(type) { const field = type === 'deposit' ? 'dAmt' : 'wAmt'; const val = parseFloat(document.getElementById(field).value); if(val > 0) socket.emit('submitGatewayRequest', { phone: currentPhone, type, amount: val }); document.getElementById(field).value = ''; }
    function toggleTab(t) { document.getElementById('tPlr').classList.toggle('active', t==='player'); document.getElementById('tAdm').classList.toggle('active', t==='admin'); document.getElementById('pSec').style.display = t==='player'?'block':'none'; document.getElementById('aSec').style.display = t==='admin'?'block':'none'; }

    function renderRequests(db) {
        const box = document.getElementById('reqBox'); box.innerHTML = ''; let count = 0;
        Object.keys(db).forEach(p => {
            if(db[p].request) {
                count++; const r = db[p].request;
                box.innerHTML += `<div class="req-row"><div>Line ${p} (${r.type})<br><b style="color:var(--gold);">৳${r.amount}</b></div><div><button class="btn-action" style="background:var(--green); color:#000;" onclick="socket.emit('adminAction',{phone:'${p}',permitted:true})">Permit</button> <button class="btn-action" style="background:var(--primary);" onclick="socket.emit('adminAction',{phone:'${p}',permitted:false})">Deny</button></div></div>`;
            }
        });
        if(count===0) box.innerHTML = '<p style="color:#8fa0b7; font-size:12px;">No active requests.</p>';
    }
</script>
</body>
</html>
