<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Funky Time 3D Max Pro Live - 24/7 Ecosystem</title>
    <!-- গ্লোবাল ফায়ারবেস কোর এবং ডাটাবেস লাইব্রেরি সিডিএন লিংক (v8 Legacy) -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        :root {
            --primary: #ff007f;
            --secondary: #7f00ff;
            --dark: #07040f;
            --neon-green: #00ff66;
            --neon-cyan: #00ffff;
            --gold: #ffcc00;
        }
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: var(--dark);
            color: #fff;
            margin: 0;
            padding: 10px;
            overflow-x: hidden;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        h1, h2, h3 {
            text-align: center;
            color: var(--primary);
            margin: 5px 0;
            text-shadow: 0 0 15px rgba(255,0,127,0.7);
        }
        .card {
            background: rgba(19, 13, 38, 0.95);
            border: 2px solid #32215c;
            padding: 15px;
            border-radius: 16px;
            margin-bottom: 12px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.7), inset 0 0 15px rgba(127,0,255,0.2);
            backdrop-filter: blur(10px);
        }
        .flex-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
        }
        .btn {
            background: linear-gradient(45deg, var(--primary), var(--secondary));
            border: none;
            color: white;
            padding: 12px 20px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            width: 100%;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 0 10px rgba(255,0,127,0.4);
        }
        .btn:hover {
            opacity: 1;
            transform: scale(1.03);
            box-shadow: 0 0 20px rgba(255,0,127,0.8), 0 0 30px rgba(127,0,255,0.6);
        }
        .btn-deposit {
            background: linear-gradient(45deg, #00b300, var(--neon-green));
            color: #000;
            width: auto;
            box-shadow: 0 0 10px rgba(0,255,102,0.4);
        }
        .btn-deposit:hover {
            box-shadow: 0 0 20px rgba(0,255,102,0.8);
        }
        .btn-withdraw {
            background: linear-gradient(45deg, #cc2900, #ff3300);
            color: white;
            width: auto;
            box-shadow: 0 0 10px rgba(255,51,0,0.4);
        }
        .btn-withdraw:hover {
            box-shadow: 0 0 20px rgba(255,51,0,0.8);
        }
        .stage-3d {
            perspective: 1200px;
            width: 100%;
            display: flex;
            justify-content: center;
            margin: 20px 0;
        }
        .wheel-box {
            position: relative;
            width: 320px;
            height: 320px;
            transform-style: preserve-3d;
            transform: rotateX(25deg);
            transition: transform 0.5s ease;
        }
        .wheel-box:hover {
            transform: rotateX(15deg) scale(1.02);
        }
        .wheel-pointer {
            position: absolute;
            top: -20px;
            left: 50%;
            transform: translateX(-50%) translateZ(20px);
            width: 0;
            height: 0;
            border-left: 18px solid transparent;
            border-right: 18px solid transparent;
            border-top: 30px solid #fff;
            z-index: 999;
            filter: drop-shadow(0 4px 10px rgba(255,255,255,0.6)) drop-shadow(0 0 15px var(--primary));
            animation: pointerPulse 1s infinite alternate;
        }
        @keyframes pointerPulse {
            0% { transform: translateX(-50%) translateZ(20px) scale(1); }
            100% { transform: translateX(-50%) translateZ(25px) scale(1.1); }
        }
        canvas {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 6px solid #251847;
            box-shadow: 0 0 35px var(--secondary), 0 0 15px var(--primary), inset 0 0 30px rgba(0,0,0,0.8);
            background: #000;
        }
        .bet-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(115px, 1fr));
            gap: 10px;
        }
        .bet-cell {
            background: linear-gradient(135deg, #1c1438, #110b26);
            border: 2px solid #45317c;
            border-radius: 12px;
            padding: 8px;
            text-align: center;
            transition: all 0.2s ease;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        .bet-cell:hover {
            border-color: var(--primary);
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(255,0,127,0.3);
        }
        .bet-cell select {
            width: 100%;
            background: #07040f;
            color: var(--neon-cyan);
            border: 1px solid #45317c;
            border-radius: 6px;
            padding: 6px;
            font-weight: bold;
            margin-top: 8px;
            cursor: pointer;
            outline: none;
            transition: border-color 0.2s;
        }
        .bet-cell select:focus {
            border-color: var(--neon-cyan);
        }
        .log-box {
            background: #05030a;
            border: 1px solid #251847;
            height: 140px;
            overflow-y: auto;
            padding: 10px;
            border-radius: 8px;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            line-height: 1.5;
            color: #d1c7f0;
        }
        .input-dark {
            background: #07040f;
            border: 2px solid #45317c;
            color: white;
            padding: 10px;
            border-radius: 8px;
            width: 80%;
            text-align: center;
            font-size: 16px;
            font-weight: bold;
            outline: none;
            transition: border-color 0.2s;
        }
        .input-dark:focus {
            border-color: var(--primary);
        }
        .bonus-highlight {
            animation: bonusGlow 1.5s infinite alternate;
            font-weight: bold;
        }
        @keyframes bonusGlow {
            0% { text-shadow: 0 0 5px currentColor; box-shadow: 0 0 5px rgba(255,0,127,0.2); }
            100% { text-shadow: 0 0 15px currentColor, 0 0 25px currentColor; box-shadow: 0 0 15px rgba(255,0,127,0.6); }
        }
    </style>
</head>
<body>
<div class="container">
    <!-- লগইন স্ক্রিন -->
    <div id="login-screen" class="card">
        <h2>🎰 FUNKY TIME LIVE 3D MAX PRO</h2>
        <div style="margin: 30px 0; text-align: center;">
            <input type="text" id="auth-email" class="input-dark" style="margin-bottom:12px;" placeholder="আপনার অ্যাকাউন্ট ইমেইল দিন...">
            <input type="password" id="auth-pass" class="input-dark" style="margin-bottom:20px;" placeholder="পাসওয়ার্ড দিন...">
            <button class="btn" onclick="loginUser()">গেমের ভেতরে প্রবেশ করুন</button>
        </div>
    </div>

    <!-- গেম মেইন প্যানেল -->
    <div id="game-panel" style="display: none;">
        <div class="card flex-row" style="background: linear-gradient(135deg, #130d26, #07040f); border-left: 5px solid var(--primary);">
            <div>
                <span style="color:#a497cd; font-size:12px; text-transform: uppercase; letter-spacing: 0.5px;">লাইভ প্লেয়ার</span>
                <div id="hud-username" style="font-size: 18px; font-weight:bold; color:#fff;">-</div>
            </div>
            <div style="text-align: right;">
                <span style="color:#a497cd; font-size:12px; text-transform: uppercase; letter-spacing: 0.5px;">মেইন ব্যালেন্স</span>
                <div style="font-size:24px; font-weight:bold; color:var(--neon-green);">৳ <span id="hud-balance">0.00</span></div>
            </div>
        </div>

        <div class="card" style="text-align: center; border-color: var(--gold); background: linear-gradient(180deg, #181132, #0d081f);">
            <div id="status-headline" style="font-size: 20px; font-weight: bold; color: var(--gold); text-transform: uppercase; letter-spacing: 1px;">কানেক্টিং...</div>
            <div style="font-size: 28px; font-weight: bold; margin: 8px 0; color: #fff;">⏰ <span id="timer-display" style="color: var(--neon-cyan);">00</span> সেকেন্ড</div>
        </div>

        <div class="card" style="background: radial-gradient(circle, #1a103c 0%, #07040f 100%);">
            <div class="stage-3d">
                <div class="wheel-box" id="3d-wheel-container">
                    <div class="wheel-pointer"></div>
                    <canvas id="wheelCanvas" width="320" height="320"></canvas>
                </div>
            </div>
        </div>

        <div class="card">
            <h3>💰 ওয়ালেট রিকোয়েস্ট (ডিপোজিট / উইথড্র)</h3>
            <div class="flex-row" style="justify-content: center; gap: 12px; margin-top: 10px;">
                <input type="number" id="wallet-amount" class="input-dark" style="width:130px;" placeholder="৳ পরিমাণ">
                <input type="text" id="wallet-phone" class="input-dark" style="width:160px;" placeholder="বিকাশ/নগদ নম্বর">
                <button class="btn btn-deposit" onclick="handleTxRequest('deposit')">ডিপোজিট</button>
                <button class="btn btn-withdraw" onclick="handleTxRequest('withdraw')">উইথড্র</button>
            </div>
        </div>

        <div class="card">
            <h3>🎲 বেটিং ম্যাট্রিক্স প্রো (সব ঘরে একসাথে মাল্টি-বাজি)</h3>
            <div class="bet-grid" id="betting-board-matrix" style="margin-top: 15px;"></div>
            <button class="btn" id="lock-bets-btn" style="margin-top: 20px; background: linear-gradient(45deg, #00cc52, var(--neon-green)); color: #000; font-size: 16px;" onclick="submitBetsToNetwork()">🔒 বাজি কনফার্ম এবং লক করুন</button>
        </div>

        <div class="card">
            <h3>📊 রিয়েল-টাইম গ্লোবাল লেজার লগ</h3>
            <div class="log-box" id="system-ledger-logs"></div>
        </div>
    </div>
</div>

<script>
    // ১. আপনার ফায়ারবেস সিঙ্গাপুর নোড কনফিগারেশন
    const firebaseConfig = {
        apiKey: "AIzaSyBkMaK2IHo2AWYTBlYBJTvu",
        authDomain: "funky-time-3bd0d.firebaseapp.com",
        databaseURL: "https://funky-time-3bd0d-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "funky-time-3bd0d",
        storageBucket: "funky-time-3bd0d.appspot.com",
        messagingSenderId: "495115287865",
        appId: "1:495115287865:web:666e7f948f8ddaea83c17a"
    };

    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();
    const auth = firebase.auth();

    // গ্লোবাল স্টেট ভেরিয়েবল
    let currentUserUid = "";
    let playerName = "";
    let playerPhone = "";
    let playerBalance = 0.00;
    let localBets = {};
    let isLockedThisRound = false;
    let currentWheelAngle = 0;
    let adminOverrideTarget = null;

    // অরিজিনাল Funky Time স্টাইল সেগমেন্ট লিস্ট
    const segments = [
        { name: "1", multiplier: 1, color: "#ff007f", isBonus: false },
        { name: "2", multiplier: 2, color: "#7f00ff", isBonus: false },
        { name: "FUNKY", multiplier: 25, color: "#ffcc00", isBonus: true },
        { name: "1", multiplier: 1, color: "#ff007f", isBonus: false },
        { name: "2", multiplier: 2, color: "#7f00ff", isBonus: false },
        { name: "PLAY", multiplier: 20, color: "#00ffff", isBonus: true },
        { name: "1", multiplier: 1, color: "#ff007f", isBonus: false },
        { name: "STAYIN", multiplier: 50, color: "#00ff66", isBonus: true },
        { name: "2", multiplier: 2, color: "#7f00ff", isBonus: false },
        { name: "VIP", multiplier: 100, color: "#ff3300", isBonus: true },
        { name: "1", multiplier: 1, color: "#ff007f", isBonus: false },
        { name: "DANCE", multiplier: 35, color: "#ff00ff", isBonus: true },
        { name: "2", multiplier: 2, color: "#7f00ff", isBonus: false },
        { name: "MAX PRO", multiplier: 15, color: "#ffaa00", isBonus: true }
    ];

    // ২. ফায়ারবেস অথেন্টিকেশন লগইন ফাংশন (রুলস কমপ্লায়েন্ট)
    function loginUser() {
        const email = document.getElementById('auth-email').value.trim();
        const password = document.getElementById('auth-pass').value.trim();

        if (!email || !password) {
            alert("অনুগ্রহ করে ইমেইল এবং পাসওয়ার্ড সঠিকভাবে দিন!");
            return;
        }

        auth.signInWithEmailAndPassword(email, password)
            .then((userCredential) => {
                currentUserUid = userCredential.user.uid;
                setupRealtimeSync();
            })
            .catch((error) => {
                alert("লগইন ব্যর্থ হয়েছে: " + error.message);
            });
    }

    // ৩. রিয়েল-টাইম ডাটাবেস ডাটা সিঙ্কিং
    function setupRealtimeSync() {
        // ১. ব্যবহারকারীর প্রোফাইল এবং ব্যালেন্স সিঙ্ক
        database.ref('users/' + currentUserUid).on('value', (snapshot) => {
            const userData = snapshot.val();
            if (!userData) {
                alert("ব্যবহারকারীর তথ্য ডাটাবেসে পাওয়া যায়নি!");
                return;
            }
            
            playerName = userData.username || "Player";
            playerPhone = userData.phone || "";
            playerBalance = parseFloat(userData.balance) || 0.00;

            document.getElementById('hud-username').innerText = playerName;
            document.getElementById('hud-balance').innerText = playerBalance.toFixed(2);
            
            // UI চেঞ্জ
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('game-panel').style.display = 'block';
        });

        // ২. অ্যাডমিন কন্ট্রোল ওভাররাইড বা উইনিং ইনডেক্স লিসেনার
        database.ref('adminControls/overrideIndex').on('value', (snapshot) => {
            adminOverrideTarget = snapshot.val(); 
        });

        renderBoardMatrix();
        draw3DWheel();
        runServerTimerLoop();
        appendLog("ইকোসিস্টেম প্লাগইন সফল! রিয়েল-টাইম কানেকশন চালু হয়েছে।");
    }

    // ৪. বেটিং বোর্ড ম্যাট্রিক্স জেনারেটর
    function renderBoardMatrix() {
        const container = document.getElementById('betting-board-matrix');
        container.innerHTML = '';
        segments.forEach((seg, idx) => {
            localBets[idx] = 0;
            const cell = document.createElement('div');
            cell.className = 'bet-cell';
            if(seg.isBonus) {
                cell.className += ' bonus-highlight';
                cell.style.color = seg.color;
            }
            cell.style.borderTop = `3px solid ${seg.color}`;
            cell.innerHTML = `
                <div style="font-weight:bold; font-size:14px;">${seg.name}</div>
                <div style="font-size:11px; opacity:0.8; margin-top:2px;">${seg.multiplier}x</div>
                <select id="select-cell-${idx}" onchange="registerLocalStake(${idx}, this.value)">
                    <option value="0">৳ ০</option>
                    <option value="10">৳ ১০</option>
                    <option value="50">৳ ৫০</option>
                    <option value="100">৳ ১০০</option>
                    <option value="500">৳ ৫০০</option>
                    <option value="1000">৳ ১০০০</option>
                </select>
            `;
            container.appendChild(cell);
        });
    }

    function registerLocalStake(index, value) {
        if (isLockedThisRound) {
            alert("এই রাউন্ডের বাজি ইতিমধ্যে লক হয়ে গেছে!");
            document.getElementById(`select-cell-${index}`).value = localBets[index] || 0;
            return;
        }
        localBets[index] = parseInt(value) || 0;
    }

    // ৫. ফায়ারবেস রুলস ম্যাচিং ডিপোজিট/উইথড্র রিকোয়েস্ট সাবমিশন
    function handleTxRequest(type) {
        const amountInput = document.getElementById('wallet-amount');
        const phoneInput = document.getElementById('wallet-phone');
        const amount = parseFloat(amountInput.value);
        const phone = phoneInput.value.trim();

        if (isNaN(amount) || amount <= 0 || !phone) {
            alert("পরিমাণ এবং সচল ফোন নম্বর সঠিকভাবে ইনপুট দিন!");
            return;
        }

        const path = type === 'deposit' ? 'deposit_requests' : 'withdraw_requests';
        
        if (type === 'withdraw' && amount > playerBalance) {
            alert("আপনার অ্যাকাউন্টে পর্যাপ্ত টাকা নেই!");
            return;
        }

        const reqId = database.ref().child(path).push().key;
        const requestData = {
            username: playerName,
            amount: amount,
            phone: phone,
            status: "pending",
            timestamp: firebase.database.ServerValue.TIMESTAMP
        };

        database.ref(`${path}/${reqId}`).set(requestData)
            .then(() => {
                appendLog(`✅ ${type === 'deposit' ? 'ডিপোজিট' : 'উইথড্র'} রিকোয়েস্ট সাবমিট হয়েছে (৳${amount})। এডমিন অনুমোদনের অপেক্ষা করুন।`);
                amountInput.value = '';
                phoneInput.value = '';
            })
            .catch((err) => {
                alert("রিকোয়েস্ট ব্যর্থ: " + err.message);
            });
    }

    // ৬. বাজি সাবমিশন এবং ভ্যালিডেশন
    function submitBetsToNetwork() {
        if (isLockedThisRound) return;

        let calculatedStakeSum = 0;
        for (let idx in localBets) {
            calculatedStakeSum += localBets[idx];
        }

        if (calculatedStakeSum === 0) {
            alert("চাকা ঘোরার আগে অন্তত একটি ঘরে বাজি ধরুন!");
            return;
        }

        if (calculatedStakeSum > playerBalance) {
            alert("আপনার মেইন ব্যালেন্সের চেয়ে বাজির পরিমাণ বেশি!");
            return;
        }

        // রুলস অনুযায়ী বাজি নিশ্চিত করা
        const activeBetsRef = database.ref('active_bets');
        
        // প্রতিটি বাজির অপশন পুশ করা
        segments.forEach((seg, idx) => {
            const stake = localBets[idx];
            if (stake >= 10) {
                const betId = activeBetsRef.push().key;
                activeBetsRef.child(betId).set({
                    username: playerName,
                    betAmount: stake,
                    selectedOption: idx.toString(),
                    timestamp: firebase.database.ServerValue.TIMESTAMP
                });
            }
        });

        // ব্যালেন্স ডিডাক্ট এবং লক
        playerBalance -= calculatedStakeSum;
        isLockedThisRound = true;
        
        database.ref(`users/${currentUserUid}`).update({ balance: playerBalance });
        
        const actionBtn = document.getElementById('lock-bets-btn');
        actionBtn.innerText = "🔒 বাji লক করা হয়েছে";
        actionBtn.style.background = "#251847";
        actionBtn.style.color = "#a497cd";
        actionBtn.disabled = true;

        segments.forEach((_, idx) => {
            const dropdown = document.getElementById(`select-cell-${idx}`);
            if (dropdown) dropdown.disabled = true;
        });

        appendLog(`🎲 বাজি নিশ্চিত: মোট ৳${calculatedStakeSum} পুলে লক করা হয়েছে।`);
    }

    // ৭. ২৪ ঘণ্টা গ্লোবাল টাইমার এবং অটো-হুইল কন্ট্রোলার
    function runServerTimerLoop() {
        const timerRef = database.ref('gameState/timer');
        const statusHeader = document.getElementById('status-headline');
        const countDisplay = document.getElementById('timer-display');

        timerRef.on('value', (snapshot) => {
            const currentSeconds = snapshot.val() || 0;
            countDisplay.innerText = currentSeconds < 10 ? '0' + currentSeconds : currentSeconds;

            if (currentSeconds > 10) {
                statusHeader.innerText = "🎯 আপনার বাজি প্লেস করুন...";
                statusHeader.style.color = "var(--gold)";
            } else if (currentSeconds <= 10 && currentSeconds > 0) {
                statusHeader.innerText = "⏳ বাজি লক হওয়ার শেষ সময়!";
                statusHeader.style.color = "#ff3300";
                
                // অটোমেটিক ড্রপডাউন লক
                segments.forEach((_, idx) => {
                    const dropdown = document.getElementById(`select-cell-${idx}`);
                    if (dropdown) dropdown.disabled = true;
                });
            } else if (currentSeconds === 0) {
                statusHeader.innerText = "🎰 লাইভ চাকা ঘুরছে! বাজি বন্ধ";
                statusHeader.style.color = "var(--neon-green)";
                processRoundPayoutEngine();
            }
        });
    }

    // ৮. ২০% অ্যাডমিন প্রফিট কন্ট্রোলিং ইঞ্জিন অ্যালগরিদম
    function processRoundPayoutEngine() {
        database.ref('active_bets').once('value', (snapshot) => {
            const allBets = snapshot.val() || {};
            let totalPoolCollection = 0;
            let expectedPayouts = new Array(segments.length).fill(0);

            // মোট জমা ক্যালকুলেশন
            for (let bId in allBets) {
                const bData = allBets[bId];
                const amt = parseFloat(bData.betAmount) || 0;
                const opt = parseInt(bData.selectedOption);
                
                totalPoolCollection += amt;
                if (opt >= 0 && opt < segments.length) {
                    expectedPayouts[opt] += (amt * segments[opt].multiplier) + amt;
                }
            }

            // অ্যাডমিন এজ রুলস: দিনশেষে ২০% লাভ নিশ্চিত রাখতে হবে (অর্থাৎ হাউজ পেআউট করবে সর্বোচ্চ ৮০%)
            const allowedMaxPayout = totalPoolCollection * 0.80;
            let eligibleIndices = [];

            segments.forEach((seg, idx) => {
                if (expectedPayouts[idx] <= allowedMaxPayout || totalPoolCollection === 0) {
                    eligibleIndices.push(idx);
                }
            });

            // চূড়ান্ত উইনিং ইনডেক্স নির্ধারণ
            let chosenWinningIdx = 0;
            
            // যদি অ্যাডমিন প্যানেল থেকে কোনো নির্দিষ্ট ঘর আগে থেকেই সিলেক্ট করা থাকে
            if (adminOverrideTarget !== null && adminOverrideTarget >= 0 && adminOverrideTarget < segments.length) {
                chosenWinningIdx = adminOverrideTarget;
            } else if (eligibleIndices.length > 0) {
                // সেফ জোনের ভেতর থেকে যেকোনো একটি ঘর দৈবচয়ন করা হবে
                chosenWinningIdx = eligibleIndices[Math.floor(Math.random() * eligibleIndices.length)];
            } else {
                // কোনো ঘর সেফ না হলে যেখানে সবচেয়ে কম পে-আউট দিতে হবে সেটিই উইন হবে
                chosenWinningIdx = expectedPayouts.indexOf(Math.min(...expectedPayouts));
            }

            triggerWheelSpinAnimation(chosenWinningIdx, allBets);
        });
    }

    // ৯. ৩ডি ঘূর্ণন অ্যানিমেশন এবং ব্যালেন্স সেটেলমেন্ট
    function triggerWheelSpinAnimation(winningIdx, allBets) {
        const sliceCount = segments.length;
        const singleSliceArc = 360 / sliceCount;
        
        const targetStopAngle = 360 - (winningIdx * singleSliceArc + singleSliceArc / 2) + 90;
        const absoluteRotationDelta = 1440 + (targetStopAngle % 360); 

        const visualContainer = document.getElementById('3d-wheel-container');
        visualContainer.style.transition = "transform 4s cubic-bezier(0.1, 0.8, 0.25, 1)";
        visualContainer.style.transform = `rotate(${absoluteRotationDelta}deg)`;

        setTimeout(() => {
            const winningNode = segments[winningIdx];
            appendLog(`🔮 রাউন্ড রেজাল্ট: স্লট [ ${winningNode.name} ] (${winningNode.multiplier}x)`);

            // উইন-লস স্টেটমেন্ট সেটেলমেন্ট
            let userWonThisRound = false;
            let winningReturn = 0;

            if (isLockedThisRound && localBets[winningIdx] > 0) {
                const userStake = localBets[winningIdx];
                winningReturn = userStake * winningNode.multiplier;
                const totalPayout = userStake + winningReturn;
                
                playerBalance += totalPayout;
                database.ref(`users/${currentUserUid}`).update({ balance: playerBalance });
                appendLog(`🎉 উইন! আপনি মোট ৳${winningReturn.toFixed(2)} প্রফিট পেয়েছেন।`);
                userWonThisRound = true;
            } else if (isLockedThisRound) {
                appendLog(`❌ এই রাউন্ডে কোনো ম্যাচিং উইন নেই।`);
            }

            // পরবর্তী রাউন্ডের জন্য সিস্টেম রিসেট
            setTimeout(() => {
                visualContainer.style.transition = "none";
                visualContainer.style.transform = `rotate(${absoluteRotationDelta % 360}deg)`;
                
                // বাজি বোর্ড রিসেট
                isLockedThisRound = false;
                const actionBtn = document.getElementById('lock-bets-btn');
                actionBtn.innerText = "🔒 বাজি কনফার্ম এবং লক করুন";
                actionBtn.style.background = "linear-gradient(45deg, #00cc52, var(--neon-green))";
                actionBtn.style.color = "#000";
                actionBtn.disabled = false;
                
                // ডাটাবেস থেকে একটিভ বেটস টেবিল ট্রাঙ্কেট/ক্লিয়ার করা (যদি প্লেয়ার এডমিন বা ওনার অ্যাকাউন্ট হয়)
                if (currentUserUid === "igJEoQnbuwZctIDNteu0QgPqY22") {
                    database.ref('active_bets').remove();
                }
                
                renderBoardMatrix();
            }, 2500);

        }, 4000);
    }

    // ১০. ৩ডি ক্যানভাস ম্যাট্রিক্স হুইল ড্রয়িং
    function draw3DWheel() {
        const canvas = document.getElementById("wheelCanvas");
        const ctx = canvas.getContext("2d");
        const total = segments.length;
        const arc = (2 * Math.PI) / total;
        ctx.clearRect(0,0,320,320);
        
        ctx.save();
        ctx.translate(160, 160);
        ctx.rotate(currentWheelAngle);

        for (let i = 0; i < total; i++) {
            ctx.fillStyle = segments[i].color;
            ctx.beginPath();
            ctx.moveTo(0, 0);
            ctx.arc(0, 0, 150, i * arc, (i + 1) * arc);
            ctx.fill();
            ctx.lineWidth = 1.5;
            ctx.strokeStyle = "rgba(7,4,15,0.6)";
            ctx.stroke();

            ctx.save();
            ctx.rotate((i * arc) + (arc / 2));
            ctx.textAlign = "right";
            ctx.fillStyle = "#ffffff";
            ctx.font = "bold 13px Arial";
            ctx.fillText(segments[i].name, 135, 5);
            ctx.restore();
        }
        ctx.restore();
        
        ctx.beginPath();
        ctx.arc(160, 160, 20, 0, 2 * Math.PI);
        let gradient = ctx.createRadialGradient(160, 160, 2, 160, 160, 20);
        gradient.addColorStop(0, '#ffffff');
        gradient.addColorStop(0.4, '#7f00ff'); 
        gradient.addColorStop(1, '#07040f');
        ctx.fillStyle = gradient;
        ctx.fill();
        ctx.strokeStyle = '#ff007f'; 
        ctx.lineWidth = 2;
        ctx.stroke();
    }

    // ১১. গ্লোবাল লেজার লগ খাতা মেইনটেইনার
    function appendLog(logContentString) {
        const ledgerNode = document.getElementById('system-ledger-logs');
        const formattedLocalTimestamp = new Date().toLocaleTimeString();
        ledgerNode.innerHTML += `<div style="padding: 4px 0; border-bottom: 1px solid #1c1438;">[${formattedLocalTimestamp}] ${logContentString}</div>`;
        ledgerNode.scrollTop = ledgerNode.scrollHeight;
    }
</script>
